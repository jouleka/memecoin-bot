[project]
name = "memebot"
version = "0.1.0"
description = "Paper-only Solana memecoin scanner and strategy-research system"
requires-python = ">=3.13"
dependencies = [
    "websockets>=15",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "bandit>=1.9,<2",
    "pip-audit>=2.10,<3",
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memebot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
